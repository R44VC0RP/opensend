<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSend · Campaign flow</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--bg:#faf9f6;--ink:#292d28;--muted:#757a70;--line:#e1e4dc;--db:#526fa8;--cpu:#96743b;--job:#80679a;--net:#397d69;--mono:"Berkeley Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 "Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:768px;margin:auto;padding:38px 24px 64px}h1{font-size:22px;line-height:1.35;font-weight:550;letter-spacing:-.4px;margin:0 0 7px}header>p{margin:0;color:var(--muted);font-size:12px}.legend{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 26px;font-size:10px;color:var(--muted)}.legend span{display:flex;gap:5px;align-items:center}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}.db{color:var(--db)}.cpu{color:var(--cpu)}.job{color:var(--job)}.net{color:var(--net)}ol{list-style:none;padding:0;margin:0}.step{position:relative;padding:0 0 27px 37px}.step:before{content:"";position:absolute;left:10px;top:23px;bottom:0;width:1px;background:var(--line)}.step:last-child:before{display:none}.number{position:absolute;left:0;top:1px;width:22px;height:22px;border:1px solid #c8cec1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);font:10px/1 var(--mono);color:#66705f}.step-head{display:flex;gap:12px;align-items:baseline;margin-bottom:9px}h2{font-size:14px;line-height:1.5;font-weight:550;margin:0;flex:1;letter-spacing:-.1px}.source{font:9px/1.5 var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:1px solid var(--line)}.source:hover{color:var(--ink);border-color:var(--ink)}.operations{display:grid;gap:4px}.operation{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:3px 0;border-radius:2px}.operation:hover,.operation:focus-visible{background:#f0f1eb}.kind{font:9px/1.6 var(--mono)}.quantity{font:10px/1.6 var(--mono);color:var(--muted);text-align:right;max-width:150px}.note{font-size:12px;color:#697160;margin:9px 0 0}.loop{font-size:12px;color:var(--net);margin:10px 0 0}.loop:before{content:"↳ ";font-size:15px}a:focus-visible,.operation:focus-visible{outline:2px solid var(--db);outline-offset:3px}.packet{position:absolute;left:8px;top:26px;width:5px;height:7px;border-radius:1px;background:#6d9781;opacity:0;pointer-events:none}.visible:not(:last-child)>.packet{animation:stream 3100ms linear infinite}.visible>.packet:nth-of-type(2){animation-delay:1500ms}.tooltip{position:fixed;z-index:5;max-width:320px;border-radius:4px;background:#293028;color:var(--bg);padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 3px 12px #0002;pointer-events:none}.tooltip[hidden]{display:none}footer{margin:5px 0 0 37px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}footer a{color:inherit;text-underline-offset:3px}@keyframes stream{0%{top:27px;opacity:0}10%,85%{opacity:.7}100%{top:calc(100% - 5px);opacity:0}}@media(prefers-reduced-motion:reduce){.packet{animation:none!important;display:none}}@media(max-width:560px){main{padding:26px 18px 45px}.step{padding-left:32px}.step-head{display:block}.source{display:inline-block;margin-top:3px}.operation{grid-template-columns:24px 1fr;gap:3px 7px}.quantity{grid-column:2;text-align:left;max-width:none;font-size:9px}.step{padding-bottom:26px}.note,.loop{font-size:11px}.legend{gap:12px}footer{margin-left:32px}}
</style>

<body>
<main>
<header><h1>50,000 emails, end to end</h1><p>Cloudflare deployment · saved campaign · static HTML · one recipient per email</p><div class="legend"><span><i class="dot db"></i>SQL: PostgreSQL</span><span><i class="dot cpu"></i>CPU: computation</span><span><i class="dot job"></i>Job: durable work</span><span><i class="dot net"></i>I/O: network or storage</span></div></header>
<ol id="flow" aria-label="Campaign processing steps"></ol>
<footer>Source: <a href="https://github.com/R44VC0RP/opensend/tree/b6e047c" target="_blank" rel="noreferrer">b6e047c</a>.</footer>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script>
'use strict';
const steps=[
{t:'Receive the send request',at:['sending.ts',857],ops:[['net','POST /v1/campaigns/{id}/send with { revision }','1 request','The saved draft contains the audience. The request does not carry 50,000 addresses.'],['cpu','Check admission, body size and request schema','12 MiB body limit','Reject invalid requests before creating durable work.']],note:'The revision identifies the exact draft being launched.'},
{t:'Authenticate and load regional configuration',at:['auth.ts',21],ops:[['cpu','Hash the API key; resolve scope and permissions','Once','The credential fixes workspace and live/test environment. Dashboard and MCP use their own identity paths.'],['db','Look up key; conditionally update last-use; increment budget','3 statements','Revoked keys cannot authenticate. The last-use UPDATE is issued every request; timestamp changes are throttled.'],['db','Read region settings and feedback registrations','2 parallel SELECTs','These reads happen before campaign handling. The API-key path therefore has five request-level statements.']],note:'Live API-key budget: 1,200 requests/minute. This is separate from SES quota.'},
{t:'Begin launch transaction; handle idempotency',at:['sending.ts',248],ops:[['db','Reserve Idempotency-Key, if supplied','INSERT','The reservation precedes campaign locking. Without the header, skip idempotency-table work.'],['db','On replay, read and return the saved result','SELECT → return','An existing matching request skips launchCampaign entirely; a different payload returns 409.']]},
{t:'Lock and validate the campaign',at:['sending.ts',916],ops:[['db','Lock campaign; remove a previous failed expansion','SELECT FOR UPDATE + DELETE','Prevent competing launches of the same revision. Reject archived, stale or noneditable campaigns.'],['db','Read region settings and live readiness','Local database checks','Validate configuration without calling AWS.'],['cpu','Validate sender/content; render shared HTML and text','Once','Campaign-wide validation runs before recipient preparation.'],['db','Reuse compatible preparation or insert a review','Conditional','The review binds content to the frozen audience.']]},
{t:'Freeze the eligible audience',at:['audience.ts',111],ops:[['db','Lock referenced lists and optional segments','1–2 SELECTs','Validate the audience objects while capturing their membership.'],['db','Filter contacts → assign ordinals → bulk-insert recipients','1 CTE statement','PostgreSQL works on the set. This is not 50,000 application/database round trips.'],['cpu','Check counts and recipient-data limits','1 GiB / review','The match cap is one million before filtering; each recipient snapshot is capped at 1 MiB. Oversized or empty snapshots roll back.']],note:'50,000 here means subscribed, unsuppressed contacts. Only referenced personalization properties are copied.'},
{t:'Reserve capacity and enqueue preparation',at:['sending.ts',916],ops:[['db','Ensure/lock admission row; count outstanding intents','3 statements','Cap outstanding intent at one million per originating credential and two million per environment.'],['db','Retain attachment references, if present','Metadata only','Protect assets from deletion; no storage bytes are downloaded here.'],['job','Insert campaign.prepare and expansion reservation','1 prepare job','No full email rows are materialized yet.'],['db','Update campaign; save idempotent result; commit','End launch transaction','Audience, capacity, references and durable work commit together.']]},
{t:'Return 202 after the snapshot commits',at:['app.ts',37],ops:[['net','Attempt a queue wake, then return queued: 50000','202 response','Middleware awaits the wake attempt; a wake failure does not erase committed jobs.']],note:'Queued means recipient intents—not email rows, SES acceptances or deliveries.'},
{t:'Wake background Workers',at:['worker.ts',24],ops:[['db','Coalesce a singleton wake','1 UPSERT','A one-second scheduler-row reservation suppresses redundant notifications.'],['net','Send Queue wake signals','Up to 8 messages','Singleton messages have a one-second delay. Larger bursts use sendBatch based on ready work.'],['job','Recover missed wakes through minute cron','Fallback','PostgreSQL owns durable work; Queue messages only prompt Workers to look for it.']],note:'Configured: 8 Queue consumers × 6 local job lanes. These are 48 nominal job lanes, not 48 guaranteed SES calls.'},
{t:'Create a job runtime',at:['dispatch.ts',11],ops:[['net','Create a lazy PostgreSQL / Hyperdrive pool','Up to 6 connections','The pool and request-owned I/O live within the invocation.'],['db','Resolve region settings and feedback registrations','2 parallel SELECTs / drain','Every drain pays this setup cost before claiming work.'],['cpu','Combine sending and operation handlers','Shared scheduler','Preparation, dispatch, recovery and webhooks can compete for the same local lanes.']]},
{t:'Claim work for the free lanes',at:['jobs.ts',18],ops:[['db','Select due jobs with SKIP LOCKED; grant leases','1 CTE / claim group','Selection and the running status, attempt count and three-minute lease update are atomic.'],['cpu','Rotate job classes and live/test preference','Local 16-turn cycle','Fairness is approximate. Eligible feedback can get a preferred slot, not a permanently dedicated lane.'],['job','Start handlers; refill each lane as it finishes','Up to 6 active','No Promise.all barrier between claim groups. Stop new claims after two seconds or 100 jobs; await existing handlers.']],note:'The claim loop no longer updates a shared rotation row. It wraps every background stage below.'},
{t:'Lock the preparation context',at:['sending.ts',1379],ops:[['db','Read review; lock campaign, review and expansion','Chunk transaction','Cursor/status guards prevent stale jobs from advancing the same review twice.'],['db','Recheck origin permission, region and attachment metadata','Shared reads','Preparation stops if authority or required configuration is no longer valid.']]},
{t:'Read the next recipient chunk',at:['sending.ts',901],ops:[['db','Read recipients after the saved ordinal','≤ 1,000 rows','The query also bounds estimated cumulative input bytes.'],['cpu','Limit input and rendered snapshot bytes','4 MiB each / chunk','Two separate byte controls can reduce chunk size. The first recipient can pass a byte boundary.']],note:'50,000 recipients require at least 50 preparation chunks; larger messages require more.'},
{t:'Validate and hash each recipient locally',at:['sending.ts',1409],ops:[['cpu','Validate shared template context and static URLs','Once / chunk','Static content can reuse one base message within the chunk.'],['cpu','Validate address; construct recipient-specific message','Per recipient','Personalized content additionally substitutes variables, escapes HTML and checks rendered URLs.'],['cpu','Hash content; size unsubscribe footer; advance review hash','Per recipient','Store enough metadata to verify later reconstruction without retaining 50,000 full bodies.']],note:'No SQL inside this recipient loop. Prepared-content cap: 64 GiB, separate from the 1 GiB audience snapshot.',loop:'Repeat for every recipient in the chunk.'},
{t:'Bulk-save preparation and checkpoint progress',at:['sending.ts',1436],ops:[['db','Bulk-update hashes, subjects and byte counts','Set-based write','Only metadata is saved per recipient; shared review content holds the body.'],['db','Update review/campaign cursor and totals','Same transaction','A retry resumes from committed progress.'],['job','Insert the next preparation job; commit','If recipients remain','The continuation commits with the cursor. Scheduler completion is a separate write.']],loop:'Repeat steps 11–14 until all 50,000 recipients pass.'},
{t:'Mark the review ready; release expansion',at:['sending.ts',1436],ops:[['db','Commit the completed review and expansion job ID','Final chunk','No recipient may reach SES before preparation finishes for the entire review.'],['job','Enqueue campaign.expand','Handoff','The next stage creates dispatchable email rows.']],note:'Terminal preparation failure marks review/expansion failed and normally returns the campaign to draft.'},
{t:'Lock expansion state',at:['sending.ts',1462],ops:[['db','Read expansion and review draft','2 SELECTs','Load the expected cursor before locked checks.'],['db','Lock campaign, admission and expansion; recheck origin','Transaction','The admission lock remains here even though job claims no longer use a shared rotation lock.']]},
{t:'Check the active dispatch buffer',at:['sending.ts',1462],ops:[['db','Count queued/attempting campaign rows; read cached rate','1 SELECT','Counts normalized campaign email rows, not every direct or legacy email.'],['cpu','Capacity = min(200, 400 − campaign, 1000 − environment)','Available rows','Per-campaign and per-environment bounds prevent materializing all 50,000 active emails at once.'],['job','If full, defer expansion by half-buffer drain time','10–2,000 ms','At 20/sec: 2s. At 1,000/sec: 200ms. At 5,000/sec: 40ms. Unknown quota retains 2s.']],note:'Deferral sets earliest availability. Queue wake delays round up to seconds; 40ms is not a guaranteed refill time.'},
{t:'Bulk-create email rows and dispatch jobs',at:['sending.ts',1490],ops:[['db','Read the next prepared recipients','≤ 200 rows','Available capacity and the recipient-byte bound can make this chunk smaller.'],['cpu','Map recipients to deferred snapshots and IDs','Local loop','Rows reference immutable review content; full HTML is reconstructed at dispatch.'],['db','Bulk-insert emails and optional attachment links','Set-based writes','Each recipient has a separate email identity.'],['job','Bulk-insert email.dispatch jobs; checkpoint expansion','1 job / email','After commit, wake workers and enqueue expansion continuation or finalization.']],loop:'Repeat steps 16–18 alongside dispatch. At least 250 productive chunks for 50,000 recipients.',note:'Expansion failure can leave the campaign “sending”: existing dispatch jobs continue, but remaining recipients are not materialized.'},
{t:'Read one email’s dispatch inputs',at:['sending.ts',1218],ops:[['db','Join email, review and frozen recipient','1 SELECT / execution','Retrieve everything needed to reconstruct the deferred message.'],['cpu','Check dispatch version and existing state','Replay guard','Stale versions stop. A previously attempting email becomes acceptance_unknown rather than being resent.'],['db','Check live region readiness','On runtime cache miss','This is a database check cached by runtime/region/stream, not AWS discovery per email.']],note:'Steps 19–27 run independently for each of the 50,000 emails.'},
{t:'Reconstruct the reviewed content',at:['sending.ts',1194],ops:[['cpu','Render recipient content; verify its prepared hash','Per email','Reconstruction must match the frozen review before provider I/O.'],['cpu','Create real unsubscribe token/footer; check final size','Per marketing email','The winning attempt claim later persists this exact content and capability.']]},
{t:'Load attachments and assemble provider content',at:['sending.ts',1237],ops:[['db','Read attachment metadata','Only if attached','No attachments means no attachment metadata query or object downloads.'],['net','Read storage bytes on cache misses','32 MiB verified-byte cache','Loads are sequential within a message; concurrent loads share invocation-local promises. Shared bytes need not be downloaded for every recipient.'],['cpu','Verify length/SHA-256; build Simple content or raw MIME','Before claiming attempt','Inline-image layouts require raw MIME. Missing/corrupt dependencies fail before any provider attempt.']]},
{t:'Reserve one regional SES slot',at:['sending.ts',1125],ops:[['db','Increment reserved count; advance next_allowed_at','1 atomic UPDATE','All workers share the workspace/environment/region row. Check freshness, daily capacity and the one-second scheduling horizon.'],['cpu','Spacing = ceil(1,000,000 × recipients / rate) µs','1 recipient here','At 20/sec the spacing is 50ms; at 1,000/sec it is 1ms. No permit batching is retained.'],['cpu','Wait until the allocated slot','Lane occupied','The sleep holds no database transaction, but consumes local job concurrency.']]},
{t:'If quota is unavailable, refresh or defer',at:['sending.ts',1140],ops:[['db','Read the failed gate','Extra SELECT','Distinguish stale quota metadata from current capacity exhaustion.'],['net','Call AWS GetAccount when metadata is stale','60s freshness','Conditional quota UPSERT preserves reservations accumulated during concurrent refreshes. No transaction spans this AWS call.'],['db','UPSERT refreshed limits; retry reservation','Refresh path','A fresh successful permit proceeds to the attempt claim.'],['job','Otherwise version and enqueue replacement dispatch','≥ 1s; daily limit: 60s','These are earliest availability times. The replacement repeats input reads and quota checks.']],note:'Excess concurrency multiplies these retries. It does not necessarily increase provider sends.'},
{t:'Atomically claim permission to send',at:['sending.ts',1255],ops:[['db','BEGIN; recheck originating authorization','Shared-lock lookup','Permission can be revoked after campaign launch.'],['db','Lock campaign/consent; recheck subscription and suppression','Claim CTE','Consent is checked again despite the frozen audience. Canceled or suppressed recipients do not call SES.'],['db','Set attempting; save snapshot/token and attempt event','Same CTE → COMMIT','Only the winning claim crosses the provider boundary. End the transaction before the network call.']],note:'Scheduled → sending can require a writer-lock retry. The illustrated immediate-send path skips that transition.'},
{t:'Call Amazon SES for this recipient',at:['sending.ts',1309],ops:[['cpu','Serialize/sign content, destination, configuration set and tags','SDK','Reuse the SDK client only within its runtime and region.'],['net','SendEmailCommand with one To recipient','1 call / attempt','This is not SendBulkEmail. A 200-row expansion still produces 200 separate sends.'],['net','Receive MessageId or an error','15s timeout','SDK maxAttempts is 1; application code decides which failures may retry.']],note:'Happy path: 50,000 SendEmail calls. MessageId means provider acceptance, not delivery.'},
{t:'Record acceptance or classify the failure',at:['sending.ts',1334],ops:[['db','Insert accepted event; store MessageId; update email','1 CTE on success','The attempt-result identity deduplicates persistence. Accepted does not publish email.sent.'],['job','HTTP 429: create an explicit version-fenced retry','2 / 4 / 8 / 16 / 32s','Five retries after the initial attempt; these are availability delays, not precise execution times.'],['cpu','Other definitive 4xx: reject; ambiguous outcome: stop','No blind resend','Transport/5xx uncertainty or failed acceptance persistence can leave acceptance_unknown even if AWS sent the mail.']]},
{t:'Complete the job and refill its lane',at:['jobs.ts',38],ops:[['db','Update job using ID, attempt and running-state fence','1 UPDATE','An expired worker cannot complete a newer lease.'],['job','Claim another due job in the freed lane','Scheduler loop','Other lanes need not finish first. Await active siblings before closing the pool.']],note:'Warm API-key success without attachments: about six data statements plus BEGIN/COMMIT, before amortized claims/configuration/wakes.',loop:'Repeat steps 19–27 for every email; quota deferrals and provider throttling add executions.'},
{t:'Continue drains while durable work remains',at:['jobs.ts',125],ops:[['db','Read earliest pending time or running lease expiry','1 SELECT / drain','Find the next opportunity without making queue messages the source of truth.'],['net','Queue a continuation when due within 60s','Whole-second delay','Otherwise cron recovers later. Successful Queue handling acknowledges its wake message.']],note:'Normal retryable job failures use up to six attempts with 15s × 4^(attempt−1) backoff, capped at one hour.'},
{t:'Finish the campaign’s dispatch phase',at:['sending.ts',1524],ops:[['db','Lock campaign; read expansion; probe queued/attempting emails','Transaction','The last materialization chunk is not enough while dispatch work remains.'],['job','If pending, enqueue another finalizer','2s earliest availability','Finalization polls until dispatch reaches terminal outcomes.'],['db','Otherwise mark campaign completed','UPDATE','Accepted, rejected, suppressed, canceled and acceptance_unknown rows do not block completion.']],note:'Completed ≠ delivered. SNS feedback runs independently and can arrive before or after this step.'},
{t:'Receive SNS delivery-result notifications',at:['operations.ts',333],ops:[['net','SNS POSTs a signed envelope to /v1/events/ses','Separate HTTP Worker','These are HTTP notifications, not result emails. They can duplicate, reorder or beat local acceptance persistence.'],['cpu','Apply ingress admission and envelope checks','6,000 requests/min/IP','This deployment limit still applies to SNS; it is not the SES recipient quota.'],['db','Read region settings and feedback registrations','2 SELECTs / callback','Request middleware performs these reads even when the signing certificate is cached.']],note:'Illustrated happy path: one Send + one Delivery notification per email, roughly 100,000 callbacks.'},
{t:'Verify SNS before trusting its payload',at:['operations.ts',283],ops:[['cpu','Validate topic, region and signing-certificate URL','Trusted AWS configuration','Restrict certificate and confirmation URLs rather than fetching arbitrary payload-supplied URLs.'],['net','Fetch certificate on cache miss','Cache: 5 min, ≤ 8 entries','A warm cache avoids the certificate request, not the two configuration SELECTs.'],['cpu','Verify RSA signature and SES account','Every callback','Unverified events cannot change email state or suppress addresses.']],note:'Subscription confirmation is a separate control-plane request, not per-email work.'},
{t:'Commit routine Send / Delivery feedback',at:['sending.ts',1030],ops:[['cpu','Extract kind, MessageId and event time','Routine path','Match provider ID with workspace, environment and region.'],['db','Lock email; dedupe receipt; insert event; advance status','1 CTE statement','Mark the new receipt processed inside its INSERT. A late Send cannot downgrade delivered state.'],['db','Insert public event and matching webhook deliveries/jobs','Same CTE','Scope, region, event type and pause filters apply. Unique constraints prevent duplicate fanout.'],['net','Wake only when downstream jobs were created','Conditional','With no subscribers, matched routine feedback creates no job or Queue wake.']],note:'Whole matched request: 2 configuration reads + 1 ingestion statement. Roughly 300,000 SQL statements for 100,000 callbacks without subscribers.'},
{t:'If feedback arrives early, preserve it for recovery',at:['sending.ts',1041],ops:[['db','Commit unmatched receipt and recovery job together','Same ingress statement','An unprocessed new receipt always has durable recovery work. Duplicate callbacks do not add another job.'],['job','Run operation.ses after provider mapping can appear','15s earliest availability','If still unmatched, retry under the normal job policy rather than guessing an association.'],['db','Read receipt + email; apply event and mark processed','2 handler calls','Scheduler claims/completion add work outside these calls.']],note:'If AWS accepted but MessageId was never saved, recovery can exhaust retries and fail inspectably.'},
{t:'Process bounces, complaints and other feedback',at:['operations.ts',460],ops:[['db','Insert deduplicated receipt + operation.ses job','Transaction at ingress','Non-routine feedback keeps the durable job path instead of routine inline ingestion.'],['db','Read receipt/email; persist event and public fanout','Worker handler','The whole non-routine lifecycle is not a single atomic statement.'],['cpu','Filter affected addresses against this email','Address loop','Do not suppress unrelated addresses supplied by an event.'],['db','Apply suppression/contact effects; then mark processed','Conditional writes','Permanent bounces and complaints suppress. Transient bounces do not universally suppress; engagement has its own effects.']],note:'These effects can change consent while later campaign recipients are still awaiting dispatch.'},
{t:'Notify subscribed outbound webhooks',at:['operations.ts',413],ops:[['db','Read delivery and current endpoint','2 SELECTs','Generation, pause, deletion and environment checks prevent stale or cross-environment delivery.'],['cpu','Decrypt secret; sign event JSON','HMAC','Standard Webhooks signature covers event ID, timestamp and body.'],['net','POST to subscriber','5s timeout','This retries independently of sending the email. Persistence failure after HTTP success can cause duplicate webhook delivery.'],['db','Insert attempt; update delivery; finalize job','Transaction + job UPDATE','Bounded job retries handle subscriber failures. No subscribers means no webhook jobs.']],note:'Simulation replaces AWS I/O and incoming SNS with in-process transport + callback jobs. It does not reproduce real SNS ingress costs or mailbox behavior.'}
];
const types={db:'SQL',cpu:'CPU',job:'Job',net:'I/O'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#flow').innerHTML=steps.map((s,i)=>`<li class="step" id="step-${i+1}"><span class="number" aria-hidden="true">${i+1}</span><i class="packet" aria-hidden="true"></i><i class="packet" aria-hidden="true"></i><div class="step-head"><h2><span class="sr-number" hidden>Step ${i+1}: </span>${esc(s.t)}</h2><a class="source" href="https://github.com/R44VC0RP/opensend/blob/b6e047c/api/src/${s.at[0]}#L${s.at[1]}" target="_blank" rel="noreferrer">${esc(s.at[0])}:${s.at[1]} ↗</a></div><div class="operations">${s.ops.map(([kind,text,count,why])=>`<div class="operation" tabindex="0" data-tip="${esc(why)}" aria-label="${esc(types[kind]+': '+text+'. '+count+'. '+why)}"><span class="kind ${kind}">${types[kind]}</span><span>${esc(text)}</span><span class="quantity">${esc(count)}</span></div>`).join('')}</div>${s.note?`<p class="note">${esc(s.note)}</p>`:''}${s.loop?`<p class="loop">${esc(s.loop)}</p>`:''}</li>`).join('');
const observer=new IntersectionObserver(entries=>entries.forEach(e=>e.target.classList.toggle('visible',e.isIntersecting)),{rootMargin:'40px'});
document.querySelectorAll('.step').forEach(el=>observer.observe(el));
const tip=document.querySelector('#tooltip');let target=null;
function hideTip(){tip.hidden=true;target?.removeAttribute('aria-describedby');target=null;}
function showTip(el){if(target&&target!==el)target.removeAttribute('aria-describedby');target=el;tip.textContent=el.dataset.tip;tip.hidden=false;el.setAttribute('aria-describedby','tooltip');const r=el.getBoundingClientRect(),t=tip.getBoundingClientRect();tip.style.left=Math.max(10,Math.min(innerWidth-t.width-10,r.left+10))+'px';tip.style.top=(r.top>t.height+12?r.top-t.height-7:Math.min(innerHeight-t.height-10,r.bottom+7))+'px';}
const flow=document.querySelector('#flow');
flow.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);});
flow.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]')&&!e.relatedTarget?.closest?.('[data-tip]'))hideTip();});
flow.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);});
flow.addEventListener('focusout',hideTip);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});
window.addEventListener('scroll',hideTip,{passive:true});window.addEventListener('resize',hideTip);
</script>
</body>
</html>
