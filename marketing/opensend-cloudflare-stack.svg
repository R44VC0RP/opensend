        font-family: "OpenTUI Mono";
        src: url("../app/public/fonts/opentui-regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "OpenTUI Mono";
        src: url("../app/public/fonts/opentui-bold.woff2") format("woff2");
        font-weight: 700;
      }
      .mono { font-family: "OpenTUI Mono", ui-monospace, monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f6f6f6"/>

