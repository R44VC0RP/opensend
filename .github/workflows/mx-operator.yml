name: MX operator

# Runs one audited operator script against the OpenSend MX database, from the Actions tab
# ("Run workflow"). The database URL never leaves the mx environment. Arguments are split on
# spaces with globbing off, so they can't run shell code.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Operator script
        required: true
        type: choice
        options: [set-hosted-limits, placement-report]
      args:
        description: Arguments, e.g. WORKSPACE_ID --send-cap 2500000 --pending-cap 200000
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mx-operator
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/opensend-mx'
    runs-on: ubuntu-latest
    environment: mx
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Run ${{ inputs.script }}
        env:
          DATABASE_URL: ${{ secrets.MX_DATABASE_URL }}
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail -f
          read -r -a argv <<< "$ARGS"
          echo "Operator: $GITHUB_ACTOR runs $SCRIPT ${argv[*]}"
          node --import tsx "scripts/$SCRIPT.ts" "${argv[@]}"
