name: Deploy MX

on:
  push:
    branches: [opensend-mx]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mx
  cancel-in-progress: false

jobs:
  deploy:
    # Only the opensend-mx branch deploys OpenSend MX, and only once its resources exist
    # (repository variable MX_DEPLOY_ENABLED=true after `tofu apply`).
    if: github.ref == 'refs/heads/opensend-mx' && vars.MX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: mx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: sdk
      - run: npm run check
        working-directory: api
      - run: npm run docs:check
        working-directory: api
      - run: npm run build
        working-directory: app
      # OpenSend MX holds only our own data until cutover; revisit automatic migrations before then.
      - run: npm run migrate
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.MX_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.MX_BETTER_AUTH_SECRET }}
          PUBLIC_URL: https://opensend.mx
          # Must match wrangler.mx.jsonc: migrations seed region settings from it.
          DEFAULT_SES_REGION: us-east-2
      # Who may sign in and who owns the default workspace are deployment settings (GitHub mx
      # environment variables), not code. Unset means nobody: both fail closed.
      - run: >-
          npx wrangler deploy --config wrangler.mx.jsonc
          --var "AUTH_ALLOWED_EMAILS:$AUTH_ALLOWED_EMAILS"
          --var "AUTH_ALLOWED_DOMAINS:$AUTH_ALLOWED_DOMAINS"
          --var "DEFAULT_WORKSPACE_OWNERS:$DEFAULT_WORKSPACE_OWNERS"
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          AUTH_ALLOWED_EMAILS: ${{ vars.MX_AUTH_ALLOWED_EMAILS }}
          AUTH_ALLOWED_DOMAINS: ${{ vars.MX_AUTH_ALLOWED_DOMAINS }}
          DEFAULT_WORKSPACE_OWNERS: ${{ vars.MX_DEFAULT_WORKSPACE_OWNERS }}
      - name: Check MX health
        run: |
          set -o pipefail
          curl --fail --silent --show-error --max-time 10 --retry 4 https://opensend.mx/health |
            jq -e '.status == "ok" and .service == "opensend" and .multiTenant == true'
      - name: Live MX E2E
        id: e2e
        working-directory: api
        timeout-minutes: 5
        env:
          OPENSEND_E2E_API_KEY: ${{ secrets.MX_E2E_API_KEY }}
        run: npm run e2e
      - name: Upload live E2E report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: mx-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: api/e2e-report.json
          if-no-files-found: error
