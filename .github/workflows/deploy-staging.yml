name: Deploy staging

on:
  push:
    branches: [opensend-mx]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only the opensend-mx branch deploys staging, and only once its resources exist
    # (set the repository variable STAGING_DEPLOY_ENABLED=true after `tofu apply`).
    if: github.ref == 'refs/heads/opensend-mx' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: sdk
      - run: npm run check
        working-directory: api
      - run: npm run docs:check
        working-directory: api
      - run: npm run build
        working-directory: app
      # Staging only: production migrations stay a manual, reviewed step.
      - run: npm run migrate
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          PUBLIC_URL: https://staging.opensend.mx
      - run: npx wrangler deploy --config wrangler.staging.jsonc
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Worker secrets live in the GitHub staging environment and are re-applied on every deploy.
      - name: Sync Worker secrets
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
        run: |
          jq -n '{BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET}' \
            | npx wrangler secret bulk --config wrangler.staging.jsonc
